# ESP32 Bluetooth Low Energy bridge, one motor UART on each channel.
# Replace the example MAC and match the channel mapping to the physical drums.
# Motor UARTs on the bridge are configured for 115200 baud.
transport: bluetooth
protocol: emm_v5_uart_0x6b
bluetooth_address: "02:00:00:00:00:00"
bluetooth_connect_timeout_s: 15.0
bluetooth_response_timeout_s: 0.40
allow_motion: false
baudrate: 115200
poll_rate_hz: 5.0
command_rate_hz: 5.0
command_timeout_s: 0.75
max_drum_speed_rad_s: 0.20
max_command_lead_rad: 0.06
hold_tolerance_rad: 0.02
acceleration: 200
axes:
  drum_1_joint:
    channel: 0
    address: 1
    expected_firmware: null
    pulses_per_revolution: 3200
    direction: 1
    gear_ratio: 1.0
    lower_rad: -1.0
    upper_rad: 1.0
  drum_2_joint:
    channel: 1
    address: 1
    expected_firmware: null
    pulses_per_revolution: 3200
    direction: 1
    gear_ratio: 1.0
    lower_rad: -1.0
    upper_rad: 1.0
  drum_3_joint:
    channel: 2
    address: 1
    expected_firmware: null
    pulses_per_revolution: 3200
    direction: 1
    gear_ratio: 1.0
    lower_rad: -1.0
    upper_rad: 1.0
